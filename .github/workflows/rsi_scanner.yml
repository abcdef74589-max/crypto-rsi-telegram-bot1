name: RSI Telegram Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rsi-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check files
        run: |
          echo "===== BOT FILE ====="
          ls -lh bot_fixed.py

          echo "===== REQUIREMENTS ====="
          cat requirements.txt

          echo "===== PYTHON ====="
          python --version

      - name: Run RSI scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOP_N: "100"
          RSI_PERIOD: "14"
          MARKET: "spot"

        run: python -u ./bot_fixed.py

      - name: Save state
        run: |

          if git diff --quiet -- users.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add users.json

          git commit \
            -m "Update Telegram scanner state"

          git push
