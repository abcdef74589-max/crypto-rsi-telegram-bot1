name: RSI Telegram Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic diagnostic
        run: |
          echo "===== TEST START ====="
          pwd
          echo "===== FILES ====="
          ls -la
          echo "===== PYTHON ====="
          python --version
          echo "===== PYTHON TEST ====="
          python -c "print('PYTHON OK')"
          echo "===== TEST END ====="
