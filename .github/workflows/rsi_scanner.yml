name: RSI Telegram Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: rsi-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Run RSI Scanner
      # -----------------------------
      - name: Run RSI Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TOP_N: "100"
          RSI_PERIOD: "14"
          MARKET: "spot"
          ALERT_MODE: "changes"

          USERS_FILE: "users.json"

        run: |
          python bot_fixed.py

      # -----------------------------
      # Save users.json
      # -----------------------------
      - name: Save users.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add users.json

          if git diff --cached --quiet; then
            echo "No users.json changes."
          else
            git commit -m "Update RSI scanner state"
            git push
          fi
