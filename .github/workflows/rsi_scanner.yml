name: RSI Telegram Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: write

concurrency:
  group: rsi-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check files and Python
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== FILES ====="
          ls -lah

          echo "===== BOT FILE ====="
          ls -lh bot_fixed.py

          echo "===== SYNTAX CHECK ====="
          python -m py_compile bot_fixed.py

      - name: Run RSI scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOP_N: "100"
          RSI_PERIOD: "14"
          ALERT_MODE: "changes"
        run: |
          echo "===== STARTING BOT ====="
          python -u bot_fixed.py
          echo "===== BOT FINISHED ====="

      - name: Save multi-user state
        if: always()
        run: |
          if [ ! -f users.json ]; then
            echo "users.json does not exist."
            exit 0
          fi

          if git diff --quiet -- users.json; then
            echo "No user-state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add users.json
          git commit -m "Update Telegram subscriber state"
          git push
