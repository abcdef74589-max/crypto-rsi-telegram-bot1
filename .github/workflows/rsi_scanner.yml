name: RSI Telegram Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: write

concurrency:
  group: rsi-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check bot file
        run: |
          echo "===== BOT FILE ====="
          ls -lh bot_fixed.py
          echo "===== PYTHON ====="
          python --version

      - name: Run RSI scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOP_N: "100"
          RSI_PERIOD: "14"
          MARKET: "spot"
          ALERT_MODE: "changes"
        run: python -u ./bot_fixed.py

      - name: Save multi-user state
        run: |
          if git diff --quiet -- users.json; then
            echo "No user-state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add users.json
          git commit -m "Update Telegram subscriber state"
          git push
